services:
  mongo:
    image: mongo:7
    container_name: veda-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - veda-mongo-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: veda-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - veda-redis-data:/data

volumes:
  veda-mongo-data:
  veda-redis-data:
